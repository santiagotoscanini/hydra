name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Two jobs on purpose. With upload and deploy back to back in one job, the
  # deploy can list the run's artifacts before the upload shows up and fail
  # with "No artifacts named github-pages were found".
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The site sits behind a CDN that caches .css and .js. Without this, a
      # deploy serves new HTML with the previous stylesheet for a while.
      - name: Stamp asset URLs with the commit
        run: sed -i -E "s#(style\.css|app\.js)\"#\1?v=${GITHUB_SHA::8}\"#g" site/index.html site/docs/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
