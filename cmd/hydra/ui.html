<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hydra</title>
<style>
:root {
  --bg: #fbfaf7; --panel: #f3f1ec; --ink: #1c1b18; --ink-2: #57544d; --ink-3: #8b877e;
  --line: #e2dfd7; --line-2: #cbc7bd;
  --run: #1d7445; --run-bg: #e2f0e6;
  --warn: #8a5200; --warn-bg: #f9eed8;
  --bad: #a3301c; --bad-bg: #f9e5df;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131412; --panel: #1a1b19; --ink: #e8e5de; --ink-2: #aaa69c; --ink-3: #75726a;
    --line: #2b2c29; --line-2: #3d3e3a;
    --run: #7cc99a; --run-bg: #17271d;
    --warn: #deaa55; --warn-bg: #2a2212;
    --bad: #f0907b; --bad-bg: #2e1713;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--sans); font-size: 14.5px; line-height: 1.5; -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 3px; }
a:hover { text-decoration-color: var(--ink); }
code, .mono { font-family: var(--mono); font-size: 0.92em; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }

.page { max-width: 1120px; margin: 0 auto; padding: 0 20px 56px; }

.top { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 16px; padding: 22px 0 18px; }
.name { font-family: var(--mono); font-weight: 600; font-size: 16px; }
.repo { font-family: var(--mono); font-size: 12.5px; color: var(--ink-3); overflow-wrap: anywhere; }
.spacer { flex: 1 1 0; }
.fresh { font-size: 12.5px; color: var(--ink-3); white-space: nowrap; }
.fresh .pulse { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--run); margin-right: 6px; vertical-align: 1px; }
.fresh.stale .pulse { background: var(--bad); }
.top button {
  border: 1px solid var(--line-2); background: none; border-radius: 4px; padding: 2px 10px; font-size: 12.5px;
  cursor: pointer; color: var(--ink-2);
}
.top button:hover { border-color: var(--ink-2); color: var(--ink); }
.top button[disabled] { opacity: 0.5; cursor: default; }

.banner { border: 1px solid var(--bad); background: var(--bad-bg); color: var(--bad); border-radius: 6px; padding: 10px 14px; margin: 0 0 16px; }

.sect { display: flex; align-items: baseline; gap: 12px; margin: 30px 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-2); font-weight: 600; }
.sect .count { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--ink-3); }

.card { border: 1px solid var(--line); border-radius: 8px; background: var(--bg); margin: 0 0 10px; overflow: hidden; }
.head { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; padding: 12px 16px; width: 100%; text-align: left; background: none; border: 0; }
button.head { cursor: pointer; }
button.head:hover { background: var(--panel); }
.head .title { font-weight: 600; font-size: 15.5px; overflow-wrap: anywhere; }
.head .sub { font-family: var(--mono); font-size: 12px; color: var(--ink-3); overflow-wrap: anywhere; }
.head .right { font-size: 12.5px; color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.caret { color: var(--ink-3); font-size: 11px; width: 10px; display: inline-block; transition: transform .12s; }
.open > .head .caret { transform: rotate(90deg); }
.body { padding: 0 16px 14px; border-top: 1px solid var(--line); }
.card:not(.open) > .body { display: none; }

.meta { font-size: 12.5px; color: var(--ink-2); padding: 10px 0 2px; overflow-wrap: anywhere; }
.meta code { color: var(--ink); }
.meta .sep { color: var(--line-2); margin: 0 6px; }

.chip { display: inline-block; font-size: 12px; line-height: 1.5; padding: 0 8px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--ink-2); white-space: nowrap; }
.chip.ok { color: var(--run); border-color: transparent; background: var(--run-bg); }
.chip.warn { color: var(--warn); border-color: transparent; background: var(--warn-bg); white-space: normal; }
.chip.bad { color: var(--bad); border-color: transparent; background: var(--bad-bg); }

.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--line-2); flex: none; }
.dot.up { background: var(--run); }
.dot.done { background: none; box-shadow: inset 0 0 0 2px var(--run); }
.dot.starting { background: var(--warn); }
.dot.failed { background: var(--bad); }
.dot.off, .dot.unknown { background: none; box-shadow: inset 0 0 0 1.5px var(--line-2); }

.prob { border-left: 3px solid var(--warn); background: var(--warn-bg); border-radius: 0 6px 6px 0; padding: 8px 12px; margin: 10px 0 0; }
.prob.bad { border-left-color: var(--bad); background: var(--bad-bg); }
.prob .what { overflow-wrap: anywhere; }
.prob pre { margin: 4px 0 0; font-family: var(--mono); font-size: 12px; color: var(--ink-2); white-space: pre-wrap; overflow-wrap: anywhere; }
.prob .fix { margin-top: 6px; font-size: 13px; color: var(--ink-2); }
.prob .fix .label { text-transform: uppercase; font-size: 11px; letter-spacing: 0.06em; margin-right: 6px; }
.copy { cursor: pointer; background: var(--bg); border: 1px solid var(--line-2); border-radius: 4px; padding: 1px 6px; color: var(--ink); }
.copy:hover { border-color: var(--ink-2); }
.copy.copied { border-color: var(--run); color: var(--run); }

.cols { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 4px 28px; margin-top: 12px; }
@media (max-width: 760px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.cols h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); font-weight: 600; padding: 0 0 4px; border-bottom: 1px solid var(--line); }
.scroll { overflow-x: auto; }
.narrow { max-width: 620px; margin-top: 12px; }

table.svc { border-collapse: collapse; width: 100%; font-size: 13.5px; }
table.svc td { padding: 5px 12px 5px 0; border-bottom: 1px solid var(--line); vertical-align: baseline; white-space: nowrap; }
table.svc tr:last-child td { border-bottom: 0; }
table.svc td.n { font-family: var(--mono); font-size: 13px; font-weight: 500; }
table.svc td.s { color: var(--ink-2); }
table.svc td.s .dot { margin-right: 7px; vertical-align: 0; }
table.svc td.s.failed { color: var(--bad); }
table.svc td.s.starting { color: var(--warn); }
table.svc td.p { font-family: var(--mono); font-size: 12.5px; color: var(--ink-2); }
table.svc td.m { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }
table.svc td:last-child { padding-right: 0; }
table.svc td.w { color: var(--ink-3); font-size: 12.5px; white-space: normal; overflow-wrap: anywhere; min-width: 160px; }
table.svc tr.dim td { color: var(--ink-3); }
.empty { color: var(--ink-3); font-size: 13px; padding: 8px 0 0; }
.also { color: var(--ink-3); font-size: 12.5px; margin-top: 10px; overflow-wrap: anywhere; }
.also b { font-weight: 500; color: var(--ink-2); }

footer { margin-top: 28px; font-size: 12.5px; color: var(--ink-3); }
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <span class="name">hydra</span>
    <span class="repo" id="repo"></span>
    <span class="spacer"></span>
    <span class="fresh" id="fresh"></span>
    <button id="refresh" title="Work out every worktree's plan again, now">refresh</button>
  </header>
  <main id="app"><p class="empty">Reading the stacks…</p></main>
  <footer>
    Process states are read every few seconds. What each worktree would run is worked out again every 10 seconds
    while its stack is up, and every 90 seconds otherwise. <code>hydra status</code> prints the same for one checkout.
  </footer>
</div>
<script>
(function () {
  var app = document.getElementById("app");
  var fresh = document.getElementById("fresh");
  var refresh = document.getElementById("refresh");
  var open = {};            // card key -> true/false, as the person left it
  var last = null, lastAt = 0, failed = false;

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function home(p) { return String(p || "").replace(/^\/(Users|home)\/[^/]+/, "~"); }
  function mem(b) {
    if (!b) return "";
    var mb = b / 1048576;
    return mb >= 1000 ? (mb / 1024).toFixed(1) + " GB" : Math.round(mb) + " MB";
  }
  function plural(n, one, many) { return n + " " + (n === 1 ? one : many); }
  function ago(iso) {
    var s = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 1000));
    return s < 60 ? s + "s ago" : Math.round(s / 60) + " min ago";
  }

  function problems(list) {
    // What blocks first, then the notes.
    list = (list || []).slice().sort(function (a, b) { return (b.blocks ? 1 : 0) - (a.blocks ? 1 : 0); });
    return list.map(function (p) {
      var parts = String(p.text).split("\n");
      var html = '<div class="prob' + (p.blocks ? " bad" : "") + '"><div class="what">' + esc(parts[0]) + "</div>";
      if (parts.length > 1) html += "<pre>" + esc(parts.slice(1).join("\n")) + "</pre>";
      if (p.fix) {
        var cmd = p.fix.split("   (")[0], rest = p.fix.slice(cmd.length);
        html += '<div class="fix"><span class="label">fix</span>';
        if (/^(hydra|git|cd) /.test(cmd)) html += '<code class="copy" title="Click to copy">' + esc(cmd) + "</code>" + esc(rest);
        else html += esc(p.fix);
        html += "</div>";
      }
      return html + "</div>";
    }).join("");
  }

  // A port is a link only while something answers there.
  function port(s, live) {
    if (!s.port) return "";
    var answers = live && (s.runs !== "here" || s.health === "up" || s.health === "starting");
    return s.url && answers ? '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">:' + s.port + "</a>" : ":" + s.port;
  }
  function row(s, cols, live) {
    var html = '<tr' + (s.off ? ' class="dim"' : "") + '><td class="n">' + esc(s.name) + "</td>" +
      (cols.indexOf("s") >= 0 ? '<td class="s ' + esc(s.health) + '"><span class="dot ' + esc(s.health) + '"></span>' + esc(s.off && s.health === "off" ? "off until started" : s.state) + "</td>" : "") +
      '<td class="p">' + port(s, live) + "</td>";
    if (cols.indexOf("m") >= 0) html += '<td class="m">' + mem(s.memory) + "</td>";
    if (cols.indexOf("w") >= 0) html += '<td class="w">' + esc(s.why || "") + "</td>";
    if (cols.indexOf("r") >= 0) html += '<td class="w">' + (s.runs === "routed" ? "main's copy, at this worktree's port" : "") + "</td>";
    return html + "</tr>";
  }
  function table(rows, cols, none, live) {
    if (!rows.length) return '<p class="empty">' + esc(none) + "</p>";
    return '<div class="scroll"><table class="svc">' + rows.map(function (s) { return row(s, cols, live); }).join("") + "</table></div>";
  }
  function isOpen(key, byDefault) { return key in open ? open[key] : byDefault; }

  function mainCard(m) {
    var running = m.processes.filter(function (s) { return s.health !== "off"; });
    var off = m.processes.filter(function (s) { return s.health === "off"; });
    var bad = (m.problems || []).filter(function (p) { return p.blocks; }).length;
    var html = '<section class="card open"><div class="head">' +
      '<span class="dot ' + (!m.up || bad ? "failed" : "up") + '"></span><span class="title">main</span>' +
      '<span class="chip ' + (m.up ? "ok" : "bad") + '">' + (m.up ? "stack up" : "stack down") + "</span>";
    if (m.behind > 0) html += '<span class="chip warn">' + plural(m.behind, "commit", "commits") + " behind its upstream</span>";
    html += '<span class="spacer"></span><span class="right">' + mem(m.memory) + "</span></div>" +
      '<div class="body"><div class="meta"><code>' + esc(m.commit) + "</code> " + esc(m.subject) +
      '<span class="sep">·</span>' + esc(m.branch ? "on " + m.branch : "detached") +
      '<span class="sep">·</span><span class="mono">' + esc(home(m.root)) + "</span></div>" +
      problems(m.problems);
    if (m.behind > 0) html += '<div class="also">Its upstream has ' + plural(m.behind, "commit", "commits") + ' it doesn\'t: <code class="copy" title="Click to copy">hydra update</code> pulls them, restarts what they touch and brings the worktrees along.</div>';
    if (m.up) {
      html += '<div class="narrow">' + table(running, ["s", "m"], "Nothing is running.", true) + "</div>";
      if (off.length) html += '<div class="also"><b>Off until started:</b> ' + off.map(function (s) { return esc(s.name); }).join(", ") + "</div>";
    }
    return html + "</div></section>";
  }

  function vsMain(w) {
    if (!w.outOfStep || !w.outOfStep.length) return '<span class="chip">in step with main</span>';
    var names = w.outOfStep.map(function (k) { return k.service; }).join(", ");
    return '<span class="chip warn">' + (w.mainBehind ? "main is behind it in " : "behind main in ") + esc(names) + "</span>";
  }

  function worktreeCard(w) {
    var bad = (w.problems || []).filter(function (p) { return p.blocks; }).length;
    var here = w.services.filter(function (s) { return s.runs === "here"; });
    var fromMain = w.services.filter(function (s) { return s.runs !== "here" && (s.used || s.runs === "routed"); });
    var unused = w.services.filter(function (s) { return s.runs === "main" && !s.used; });
    var key = "wt:" + w.root, isopen = isOpen(key, w.up);
    var dot = w.error ? "failed" : !w.up ? "off" : bad ? "failed" : "up";
    var counts = [];
    if (w.behind) counts.push(w.behind + " behind");
    if (w.ahead) counts.push(w.ahead + " ahead");
    if (w.memory) counts.push(mem(w.memory));
    var html = '<section class="card' + (isopen ? " open" : "") + '">' +
      '<button class="head" data-key="' + esc(key) + '" aria-expanded="' + isopen + '">' +
      '<span class="caret">▶</span><span class="dot ' + dot + '"></span>' +
      '<span class="title">' + esc(w.branch || "(no branch checked out)") + "</span>" +
      '<span class="chip ' + (w.up ? "ok" : "") + '">' + (w.up ? "running" : "stopped") + "</span>";
    if (!w.error) html += vsMain(w);
    if (w.up && bad) html += '<span class="chip bad">' + plural(bad, "problem", "problems") + "</span>";
    html += '<span class="spacer"></span><span class="right">' + esc(counts.join(" · ")) + "</span></button>";

    html += '<div class="body"><div class="meta">';
    if (w.commit) html += "<code>" + esc(w.commit) + "</code> " + esc(w.subject) + '<span class="sep">·</span>';
    html += (w.slot ? "slot " + w.slot : "no slot yet") + '<span class="sep">·</span><span class="mono">' + esc(home(w.root)) + "</span></div>";
    if (w.error) return html + '<div class="prob bad"><div class="what">' + esc(w.error) + "</div></div></div></section>";
    html += problems(w.up ? w.problems : (w.problems || []).filter(function (p) { return p.blocks; }));
    html += '<div class="cols"><div><h3>' + (w.up ? "Runs here" : "Would run here") + "</h3>" +
      table(here, w.up ? ["s", "m", "w"] : ["w"], "Nothing: this branch changed no service.", w.up) + "</div>" +
      "<div><h3>From main</h3>" + table(fromMain, ["s", "r"], "Nothing.", w.up) + "</div></div>";
    if (unused.length) html += '<div class="also"><b>Main\'s, and not used by anything here:</b> ' + unused.map(function (s) { return esc(s.name); }).join(", ") + "</div>";
    if (!w.up) html += '<div class="also">Start it there with <code>hydra up -D</code>.</div>';
    return html + "</div></section>";
  }

  function render(d) {
    document.getElementById("repo").textContent = home(d.repo);
    document.title = "hydra · " + home(d.repo).split("/").pop();
    if (d.error || !d.main) {
      app.innerHTML = '<div class="banner">' + esc(d.error || "No answer.") + "</div>";
      return;
    }
    var wts = d.worktrees.slice().sort(function (a, b) {
      return (b.up - a.up) || (((b.outOfStep || []).length > 0) - ((a.outOfStep || []).length > 0)) ||
        String(a.branch || a.dir).localeCompare(String(b.branch || b.dir));
    });
    var up = wts.filter(function (w) { return w.up; }).length;
    var total = wts.reduce(function (s, w) { return s + (w.memory || 0); }, 0);
    var count = wts.length ? plural(up, "running", "running") + " · " + (wts.length - up) + " stopped" + (total ? " · " + mem(total) : "") : "none";
    app.innerHTML = '<h2 class="sect">Main checkout</h2>' + mainCard(d.main) +
      '<h2 class="sect">Worktrees <span class="count">' + count + "</span></h2>" +
      (wts.length ? wts.map(worktreeCard).join("") : '<p class="empty">No worktrees. <code>git worktree add</code> makes one.</p>');
  }

  function tick() {
    if (!last) return;
    fresh.className = "fresh" + (failed ? " stale" : "");
    fresh.innerHTML = '<span class="pulse"></span>' + (failed ? "hydra ui isn't answering; showing what it said " : "updated ") + ago(last.at);
  }

  function load(force) {
    if (window.HYDRA_STATUS) { last = window.HYDRA_STATUS; render(last); tick(); return Promise.resolve(); }
    return fetch("/api/status" + (force ? "?refresh" : ""), { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (d) { last = d; lastAt = Date.now(); failed = false; render(d); tick(); })
      .catch(function () { failed = true; tick(); if (!last) app.innerHTML = '<div class="banner">Can\'t reach hydra ui. Is it still running?</div>'; });
  }

  app.addEventListener("click", function (e) {
    var copy = e.target.closest(".copy");
    if (copy) {
      var done = function () { copy.classList.add("copied"); setTimeout(function () { copy.classList.remove("copied"); }, 900); };
      if (navigator.clipboard) navigator.clipboard.writeText(copy.textContent).then(done, function () {});
      e.stopPropagation();
      return;
    }
    var head = e.target.closest("button.head");
    if (head && !e.target.closest("a")) {
      var card = head.parentNode, now = !card.classList.contains("open");
      open[head.dataset.key] = now;
      card.classList.toggle("open", now);
      head.setAttribute("aria-expanded", now);
    }
  });
  refresh.addEventListener("click", function () {
    refresh.disabled = true; refresh.textContent = "working…";
    load(true).then(function () { refresh.disabled = false; refresh.textContent = "refresh"; });
  });

  load(false);
  if (!window.HYDRA_STATUS) {
    setInterval(function () { if (!document.hidden) load(false); }, 3000);
    document.addEventListener("visibilitychange", function () { if (!document.hidden) load(false); });
  }
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
