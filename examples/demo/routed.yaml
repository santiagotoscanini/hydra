# One frontend for every worktree. `web` and `admin` are routed: the main
# checkout's copy serves each worktree through that worktree's own port, and
# its calls to the api land on the worktree's api when the worktree runs one.
#
#   web    a Node server that knows nothing about hydra; `routed: node` loads
#          hydra's hook into it, which passes the worktree tag along.
#   admin  passes the X-Hydra-Worktree header on itself (`routed: true`).
#
# web and api also have a hosts port: <worktree>.localhost:21900 is that
# worktree's web, whatever copy it uses, and localhost:21900 main's.
#
# hooks stands in for cloudflared: a public address whose requests arrive
# on :21079, where hydra's router passes them to the api of whichever
# checkout holds the tunnel (`hydra tunnel take`).
version: "0.5"

x-hydra:
  slot_stride: 100
  max_slots: 5

processes:
  api:
    command: bin/mocksvc
    # In a worktree, an edit restarts it (process-compose's own file watch;
    # hydra drops it in main, where code only changes on `hydra update`).
    watch:
      debounce: 200ms
      paths:
        - path: ./apps/api
          include: ["*.go"]
    x-hydra:
      port: 21010
      hosts: 21910
      paths: ["apps/api/**"]

  web:
    command: node web.cjs
    depends_on:
      api: { condition: process_started }
    x-hydra:
      port: 21000
      hosts: 21900
      paths: ["apps/web/**"]
      routed: node
      upstreams:
        API_URL: api

  admin:
    command: bin/mocksvc
    depends_on:
      api: { condition: process_started }
    x-hydra:
      port: 21001
      paths: ["apps/admin/**"]
      routed: true
      upstreams:
        API_URL: api

  hooks:
    command: sleep 1000000
    x-hydra:
      tunnel: { to: api, port: 21079, url: https://hooks.example.test }
