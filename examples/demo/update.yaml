# The stack behind update.sh: a job that installs dependencies, a database
# with a migrations job, an API, and a frontend that one copy serves to
# every worktree. Every service is the `mocksvc` binary.
version: "0.5"

x-hydra:
  slot_stride: 100
  max_slots: 8
  ignore: ["docs/**", "README", ".gitignore", "process-compose.yaml"]

processes:
  # Off until someone starts it. An update must leave it off.
  seed:
    command: "echo seeding; sleep 1000"
    disabled: true
    x-hydra: { paths: ["db/seed/**"] }

  # Off until someone starts it too, which the demo does. It takes a moment
  # to stop, as an agent that finishes its calls first does: an update that
  # restarts it has to wait for the new run.
  agent:
    command: "trap 'sleep 1.5; exit 0' TERM; echo agent up; while :; do sleep 0.2; done"
    disabled: true
    depends_on:
      api: { condition: process_healthy }
    x-hydra: { paths: ["apps/agent/**"] }

  # Never says it is ready. Off until someone starts it, which the demo does:
  # `hydra status --wait` has to give up on it, and say so.
  stuck:
    command: "echo warming up; exec sleep 1000"
    ready_log_line: this line never comes
    disabled: true
    x-hydra: { paths: ["apps/stuck/**"] }

  # Three of a kind, each with a step of its own before it starts in a
  # worktree (`prepare`), the way a Temporal worker has its namespace made
  # first. None starts before its step has ended, also when one edit adds all
  # six processes to a running stack at once: hydra hands them to
  # process-compose in order.
  jobs-a: &jobs
    command: "test -e .process-compose/$$HYDRA_SERVICE-prepared || { echo started before its prepare step ended; exit 1; }; echo up; exec sleep 1000"
    x-hydra:
      paths: ["apps/jobs/**"]
      baseline_command: "exec sleep 1000"
      prepare: "sleep 1; touch .process-compose/$$HYDRA_SERVICE-prepared"
  jobs-b: *jobs
  jobs-c: *jobs

  # Three more: each asks the api it waits for as it starts, and gives up when
  # nothing answers. A worktree runs them on main's api until an edit brings
  # the api there too. They are then restarted on that api's address, and
  # have to wait until it is up.
  ask-a: &ask
    command: "curl -sf -o /dev/null $$API_URL || { echo started before the api it waits for was up; exit 1; }; echo up; exec sleep 1000"
    depends_on:
      api: { condition: process_healthy }
    x-hydra:
      paths: ["apps/ask/**"]
      upstreams: { API_URL: api }
  ask-b: *ask
  ask-c: *ask

  # Jobs carry paths too: `hydra update` runs them again when a pull changes
  # those files, before it restarts the services that wait for them.
  deps:
    command: "echo installing $(cat lock.txt 2>/dev/null); sleep 1"
    x-hydra: { follow: true, paths: ["lock.txt"] }

  db:
    command: bin/mocksvc
    x-hydra: { shared: true, port: 21030, url: "postgres://{host}:{port}/app" }

  migrate:
    command: "test ! -e db/migrations/FAIL && echo applied $(ls db/migrations | wc -l) migrations"
    depends_on:
      db: { condition: process_started }
    x-hydra: { shared: true, paths: ["db/migrations/**"] }

  api:
    command: bin/mocksvc
    depends_on:
      deps: { condition: process_completed_successfully }
      migrate: { condition: process_completed_successfully }
    readiness_probe:
      http_get: { host: 127.0.0.1, port: 21010, path: / }
      period_seconds: 1
    x-hydra:
      port: 21010
      paths: ["apps/api/**"]
      upstreams: { DATABASE_URL: db }

  web:
    command: bin/mocksvc
    depends_on:
      api: { condition: process_healthy }
    x-hydra:
      port: 21000
      paths: ["apps/web/**"]
      routed: true # mocksvc passes X-Hydra-Worktree on itself
      upstreams: { API_URL: api }
